services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jyotish
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # Speaks the Upstash REST protocol, so the Worker uses the same client locally as in production.
  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports: ["8079:80"]
    depends_on: [redis]
volumes:
  pgdata:
